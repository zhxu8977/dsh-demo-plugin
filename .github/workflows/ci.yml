name: CI

# 触发时机：推到 main、开/更新 PR、以及网页上手动点一下
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 检查与测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: npm run check

      - name: 单元测试
        run: npm test

      - name: package.json 结构自检
        run: |
          node -e "
            const p = require('./package.json');
            const must = [['main', p.main], ['dsh.bundle.patch', p.dsh && p.dsh.bundle && p.dsh.bundle.patch]];
            for (const [key, value] of must) {
              if (!value) { console.error('缺少字段：' + key); process.exit(1); }
              console.log('OK ' + key + ' -> ' + value);
            }
          "
